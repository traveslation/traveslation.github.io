<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Traveslation</title>
<meta name="description" content="Point your camera, understand the menu, order, and talk with staff. Works without a connection.">
<meta name="theme-color" content="#F4F5F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Traveslation">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#F4F5F0; --card:#FFFFFF; --sage:#E6ECE4; --sage2:#D6DFD3; --line:#E1E5DC; --ink:#14201B; --muted:#6B746E; --muted2:#98A09A;
  --green:#1F4D3A; --green2:#2A6A50; --accent-ink:#FFFFFF; --cream:#FBF7EC; --warn:#B8541E; --ok:#2E7D57;
  --display:"SF Pro Display","Avenir Next","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
  --body:system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --cjk:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --r:16px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);overflow:hidden;-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.brand{font:700 24px/1 var(--display);letter-spacing:-.03em}
.brand i{color:var(--green);font-style:normal}
.pill{appearance:none;border:0;background:var(--sage);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.pill svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill.warn{background:#F6E7DA}
.pill.busy{background:var(--sage)}
.pairrow{display:flex;align-items:center;gap:8px;margin:4px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 6px 4px 4px}
.pairrow select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font:600 15px var(--body);color:var(--ink);padding:9px 10px;flex:1;min-width:0;text-overflow:ellipsis}
.pairrow .swap{width:40px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.pairrow .swap svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pairrow .en{font:600 15px var(--body);padding:9px 12px;flex:1;text-align:right}
.strip{display:none;align-items:center;gap:10px;margin:0 max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;font-size:13px}
.strip.on{display:flex}
.strip .bar{flex:1;height:6px;background:var(--sage);border-radius:3px;overflow:hidden}
.strip .bar i{display:block;height:100%;width:0;background:var(--green);transition:width .3s}
.strip b{white-space:nowrap;font-weight:600}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.view.on{display:flex}
.nav{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--card);border-top:1px solid var(--line);
  padding:6px max(12px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.nav button{appearance:none;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 6px;font-size:12px;font-weight:600}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--ink)}
.nav button .badge{position:absolute;margin-left:28px;margin-top:-4px;background:var(--green);color:#fff;font-size:10px;border-radius:999px;padding:1px 6px}

/* Camera */
.stage{position:relative;flex:1;min-height:0;background:#1b1f1c;overflow:hidden;border-radius:22px 22px 0 0}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
canvas.overlay{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.stage .tl{position:absolute;top:12px;left:12px;display:flex;gap:8px;align-items:center}
.stage .tr{position:absolute;top:12px;right:12px}
.chip{background:rgba(20,32,27,.78);backdrop-filter:blur(8px);color:#fff;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:#7BE0A7}
.chip.off .dot{background:#F0B24A}
.rbtn{appearance:none;border:0;width:40px;height:40px;border-radius:50%;background:rgba(20,32,27,.78);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center}
.rbtn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rbtn.on{background:#fff} .rbtn.on svg{stroke:var(--ink)}
.stage .hint{position:absolute;left:50%;bottom:66px;transform:translateX(-50%);background:rgba(20,32,27,.78);backdrop-filter:blur(8px);color:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;white-space:nowrap;opacity:0;transition:opacity .25s}
.stage .hint.on{opacity:1}
.stage .modes{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px}
.mbtn{appearance:none;border:0;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;background:rgba(255,255,255,.92);color:var(--ink);white-space:nowrap}
.mbtn.dark{background:rgba(20,32,27,.82);color:#fff}
.mbtn.on{background:var(--green);color:#fff}
.orderbar{display:none;align-items:center;justify-content:space-between;gap:10px;background:var(--green);color:#fff;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));font-weight:600;font-size:15px}
.orderbar.on{display:flex}
.orderbar svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-right:6px}
.orderbar button{appearance:none;border:0;background:transparent;color:#fff;font-weight:600}

/* Generic sheet */
.sheetwrap{position:absolute;inset:0;z-index:30;display:none;align-items:flex-end;background:rgba(20,32,27,.28)}
.sheetwrap.on{display:flex}
.sheet{position:relative;background:var(--bg);border-radius:24px 24px 0 0;width:100%;max-height:86%;overflow:auto;padding:10px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--sage2);margin:2px auto 6px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sheet h2{font:700 28px/1.15 var(--display);margin:0;letter-spacing:-.02em}
.sheet .close{position:absolute;right:18px;top:18px;width:36px;height:36px;border-radius:50%;background:var(--sage);border:0;display:flex;align-items:center;justify-content:center}
.sheet .close svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round}
.sheet .sub{color:var(--muted);font-size:15px}
.sheet .sub .cjk{font-family:var(--cjk)}
.hr{height:1px;background:var(--line)}
.kv{display:flex;flex-direction:column;gap:4px}
.kv p{margin:0;font-size:15px;line-height:1.45}
.btn{appearance:none;border:0;border-radius:14px;background:var(--green);color:#fff;font:600 16px var(--body);padding:15px 16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.soft{background:var(--sage);color:var(--ink)}
.btn:disabled{opacity:.5}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.qty{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qty .ctl{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.qty .ctl button{appearance:none;border:0;background:transparent;width:44px;height:44px;font-size:20px}
.qty .ctl span{min-width:28px;text-align:center;font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card .t{font-weight:600}
.card .d{color:var(--muted);font-size:14px}
.evid{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.evid b{font-weight:600;white-space:nowrap}
.evid span{color:var(--muted)}
.orderline{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.orderline:last-child{border-bottom:0}
.orderline .n{flex:1;min-width:0}
.orderline .n .cjk{font-family:var(--cjk);color:var(--muted);font-size:14px}
.orderline .p{font-weight:600;white-space:nowrap}
.bigcard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;font-family:var(--cjk)}
.bigcard .zh{font-size:clamp(26px,7.5vw,40px);line-height:1.35;font-weight:600}
.bigcard .en{font-family:var(--body);color:var(--muted);font-size:15px;margin-top:8px}
textarea,input[type=text]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
textarea{min-height:80px;resize:vertical}

/* Conversation */
.col{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:4px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));overflow:auto}
h1.hd{font:700 30px/1.15 var(--display);letter-spacing:-.03em;margin:0}
.ctx{background:var(--sage);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.ctx svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ctx .t{font-weight:600} .ctx .d{font-size:13px;color:var(--muted)}
.turns{display:flex;flex-direction:column;gap:10px}
.turn{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;max-width:88%}
.turn.me{align-self:flex-end;background:var(--cream)}
.turn .who{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.turn .src{font-family:var(--cjk);font-size:17px}
.turn .tr{font-size:17px;margin-top:4px}
.turn.live .tr,.turn.live .src{color:var(--green2)}
.turn .acts{display:flex;gap:10px;margin-top:8px}
.turn .acts button{appearance:none;border:0;background:transparent;color:var(--green);font-size:13px;font-weight:600;padding:0}
.sugg{display:flex;flex-direction:column;gap:8px}
.sugg button{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px 14px;text-align:left;font-size:15px;display:flex;gap:10px;align-items:center}
.sugg button svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.talk{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.talk .btn{padding:16px 12px}
.talk .btn.on{background:#B8541E}
.link{appearance:none;border:0;background:transparent;color:var(--green);text-decoration:underline;font-size:14px;font-weight:600;align-self:center}
.typed{display:flex;gap:8px}
.typed input{flex:1}
.typed button{width:52px;border-radius:14px;border:0;background:var(--green);color:#fff}
.typed button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Saved */
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.item .n{flex:1;min-width:0} .item .n .cjk{font-family:var(--cjk);color:var(--muted);font-size:14px}
.item button{appearance:none;border:0;background:var(--sage);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600}
.seg{display:flex;background:var(--sage);border-radius:999px;padding:3px}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;flex:1}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* readiness */
.ready{display:flex;flex-direction:column}
.ready div{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.ready div:last-child{border-bottom:0}
.ready .st{font-weight:600;color:var(--muted);white-space:nowrap}
.ready .st.ok{color:var(--ok)} .ready .st.no{color:var(--warn)}
.packs{display:flex;flex-direction:column}
.pack{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.pack:last-child{border-bottom:0}
.pack .n{font-weight:600} .pack .d{font-size:13px;color:var(--muted);grid-column:1}
.pack .bar{grid-column:1/-1;height:4px;background:var(--sage);border-radius:2px;overflow:hidden;margin-top:4px}
.pack .bar i{display:block;height:100%;width:0;background:var(--green);transition:width .3s}
.pack .st{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.pack .st.ok{color:var(--ok)}
.pack button{appearance:none;border:0;background:var(--sage);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600}
.toast{position:absolute;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;display:none;z-index:40;max-width:90%;text-align:center}
.toast.on{display:block}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:18px 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">Traveslation<i>.</i></div>
    <button class="pill" id="readyBtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg><span id="readyLabel">Checking</span></button>
  </div>
  <div class="pairrow">
    <select id="lang" aria-label="Language to translate from"></select>
    <span class="swap"><svg viewBox="0 0 24 24"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg></span>
    <span class="en">English</span>
  </div>
  <div class="strip" id="strip"><b id="stripLabel">Setting up</b><span class="bar"><i id="stripBar"></i></span><span id="stripPct">0%</span></div>

  <main>
    <!-- CAMERA -->
    <section class="view on" id="v-camera">
      <div class="stage" id="stage">
        <video id="video" playsinline muted autoplay></video>
        <canvas class="overlay" id="overlay"></canvas>
        <div class="tl"><div class="chip" id="liveChip"><span class="dot"></span><span id="liveLabel">Live translation</span></div></div>
        <div class="tr"><button class="rbtn" id="freezeBtn" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button></div>
        <div class="hint" id="hint"></div>
        <div class="modes">
          <button class="mbtn" id="modeMenu">Menu</button>
          <button class="mbtn dark" id="askBtn">Ask about this</button>
        </div>
      </div>
      <div class="orderbar" id="orderbar"><span><svg viewBox="0 0 24 24"><path d="M5 3v18M5 11h4V3M12 3v18M19 3c-2 0-3 3-3 6s1 4 3 4v8"/></svg><span id="orderCount">Your order · 0 items</span></span><button id="orderView">View →</button></div>
    </section>

    <!-- CONVERSATION -->
    <section class="view" id="v-conv">
      <div class="col" id="convCol">
        <div class="eyebrow" id="convEyebrow">Conversation</div>
        <h1 class="hd">A little help<br>finding the words.</h1>
        <div class="ctx" id="convCtx" hidden><svg viewBox="0 0 24 24"><path d="M5 3v18M5 11h4V3M12 3v18M19 3c-2 0-3 3-3 6s1 4 3 4v8"/></svg><div><div class="t">Place your order</div><div class="d" id="convCtxD"></div></div></div>
        <div class="row">
          <div class="seg" id="scenario" style="flex:1"></div>
        </div>
        <div class="turns" id="turns"></div>
        <div>
          <div class="eyebrow" style="margin-bottom:8px">Suggested reply</div>
          <div class="sugg" id="sugg"></div>
        </div>
        <div class="talk">
          <button class="btn" id="speakBtn"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span>Speak English</span></button>
          <button class="btn ghost" id="listenBtn"><svg viewBox="0 0 24 24"><path d="M3 12h3l3-7 4 14 3-9 2 3h3"/></svg><span>Listen</span></button>
        </div>
        <div class="typed"><input type="text" id="typedText" placeholder="Or type in English"><button id="typedSend" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button></div>
        <button class="btn ghost" id="confirmBtn">Confirm the details</button>
        <button class="link" id="rescueBtn">We misunderstood each other</button>
        <div class="empty" id="convStatus"></div>
      </div>
    </section>

    <!-- SAVED -->
    <section class="view" id="v-saved">
      <div class="col">
        <div class="eyebrow">Saved</div>
        <h1 class="hd">Your trip,<br>in your pocket.</h1>
        <div class="seg" id="savedTabs"><button data-t="places" class="on">Places</button><button data-t="phrases">Phrases</button><button data-t="orders">Meals</button></div>
        <div class="list" id="savedList"></div>
        <button class="btn soft" id="savedAdd">Add a place or phrase</button>
      </div>
    </section>
  </main>

  <nav class="nav" aria-label="Sections">
    <button class="on" data-v="camera"><svg viewBox="0 0 24 24"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/></svg>Camera</button>
    <button data-v="conv"><svg viewBox="0 0 24 24"><path d="M4 12h2M8 8v8M12 5v14M16 9v6M20 11v2"/></svg>Conversation</button>
    <button data-v="saved"><svg viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg>Saved</button>
  </nav>

  <div class="sheetwrap" id="sheetwrap"><div class="sheet" id="sheet" role="dialog"></div></div>
  <div class="toast" id="toast"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.26.0/dist/index.min.js"></script>
<script src="glossary.js"></script>
<script src="mt.js"></script>
<script src="app.js"></script>
</body>
</html>
